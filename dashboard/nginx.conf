server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Endpoints internos de n8n (RAG, config, destinatarios): n8n los llama directo a rag-api:8000
    # por argos-net; el dashboard no los usa, así que no se exponen por este proxy.
    location ~ ^/api/(query|upsert|internal/|notifications/recipients) {
        return 404;
    }

    # Proxy al RAG API (mismo argos-net). El trailing slash elimina el prefijo /api/:
    #   /api/incidents/metrics -> http://rag-api:8000/incidents/metrics
    location /api/ {
        proxy_pass http://rag-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback: cualquier ruta no-archivo cae en index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
