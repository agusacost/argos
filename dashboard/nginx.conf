server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Endpoints internos de n8n (RAG, config, destinatarios): n8n los llama directo a rag-api:8000
    # por argos-net; el dashboard no los usa, así que no se exponen por este proxy.
    location ~ ^/api/(query|upsert|internal/|notifications/recipients) {
        return 404;
    }

    # Proxy a la Argos API (mismo argos-net). El rewrite elimina el prefijo /api/:
    #   /api/incidents/metrics -> http://rag-api:8000/incidents/metrics
    # El nombre se resuelve por el DNS de Docker en cada request (resolver + variable): asi el panel
    # sigue funcionando cuando el contenedor de la API se recrea y cambia de IP, sin reiniciar este Nginx.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $rag_upstream rag-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$rag_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Export estático de Next.js: cada vista es un HTML (/metricas -> metricas.html).
    # Una ruta inexistente devuelve 404 con la página not-found del panel.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;
}
