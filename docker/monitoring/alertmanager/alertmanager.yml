global:
  resolve_timeout: 5m
  smtp_require_tls: true

route:
  receiver: email-default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: email-critical
      repeat_interval: 1h
    - matchers:
        - severity = warning
      receiver: email-default
    - matchers:
        - alertname = Watchdog
      receiver: null-receiver

receivers:
  - name: null-receiver

  - name: email-default
    email_configs:
      - to: REPLACE_WITH_DESTINATION_EMAIL
        from: REPLACE_WITH_SENDER_EMAIL
        smarthost: smtp.gmail.com:587
        auth_username: REPLACE_WITH_SMTP_USER
        auth_password: REPLACE_WITH_SMTP_APP_PASSWORD
        send_resolved: true
        headers:
          subject: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }} — {{ .CommonAnnotations.summary }}'

  - name: email-critical
    email_configs:
      - to: REPLACE_WITH_DESTINATION_EMAIL
        from: REPLACE_WITH_SENDER_EMAIL
        smarthost: smtp.gmail.com:587
        auth_username: REPLACE_WITH_SMTP_USER
        auth_password: REPLACE_WITH_SMTP_APP_PASSWORD
        send_resolved: true
        headers:
          subject: '[CRITICAL] {{ .GroupLabels.alertname }} — {{ .CommonAnnotations.summary }}'

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: [alertname]
