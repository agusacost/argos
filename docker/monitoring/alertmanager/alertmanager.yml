global:
  resolve_timeout: 5m
  smtp_require_tls: true

route:
  receiver: email-default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # ─── Camino inteligente (Sprint 4): las alertas de incidente van a n8n ───────
    # Estas alertas activan el flujo RAG → Claude → notificación enriquecida.
    # No se emiten por email desde Alertmanager para evitar doble notificación:
    # el email final (con síntesis + pasos) lo envía el workflow de n8n.
    - matchers:
        - alertname =~ "NginxHighErrorRate|NginxCriticalErrorRate|NginxHighResponseTime|NginxSuspiciousIPActivity|NginxErrorLogSpike"
      receiver: webhook-n8n
      group_wait: 30s
      repeat_interval: 1h
    - matchers:
        - severity = critical
      receiver: webhook-n8n
      repeat_interval: 1h
    # ─── Resto de alertas: email tradicional ─────────────────────────────────────
    - matchers:
        - severity = warning
      receiver: email-default
    - matchers:
        - alertname = Watchdog
      receiver: null-receiver

receivers:
  - name: null-receiver

  - name: webhook-n8n
    webhook_configs:
      - url: http://n8n:5678/webhook/argos-alerts
        send_resolved: true

  - name: email-default
    email_configs:
      - to: REPLACE_WITH_DESTINATION_EMAIL
        from: REPLACE_WITH_SENDER_EMAIL
        smarthost: smtp.gmail.com:587
        auth_username: REPLACE_WITH_SMTP_USER
        auth_password: REPLACE_WITH_SMTP_APP_PASSWORD
        send_resolved: true
        headers:
          subject: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }} — {{ .CommonAnnotations.summary }}'

  - name: email-critical
    email_configs:
      - to: REPLACE_WITH_DESTINATION_EMAIL
        from: REPLACE_WITH_SENDER_EMAIL
        smarthost: smtp.gmail.com:587
        auth_username: REPLACE_WITH_SMTP_USER
        auth_password: REPLACE_WITH_SMTP_APP_PASSWORD
        send_resolved: true
        headers:
          subject: '[CRITICAL] {{ .GroupLabels.alertname }} — {{ .CommonAnnotations.summary }}'

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: [alertname]
