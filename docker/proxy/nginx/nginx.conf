user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Formato de log JSON estructurado para análisis con Claude y Loki
    # Este formato incluye todos los campos necesarios para:
    # - Detección de ataques (SQLi, XSS, etc.)
    # - Análisis de rendimiento (tiempos de respuesta, latencia)
    # - Correlación de eventos (tracking de IPs, sesiones)
    log_format json_combined escape=json '{'
      '"time":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"remote_user":"$remote_user",'
      '"request_method":"$request_method",'
      '"request_uri":"$request_uri",'
      '"request_protocol":"$server_protocol",'
      '"status":"$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"http_referer":"$http_referer",'
      '"http_user_agent":"$http_user_agent",'
      '"http_x_forwarded_for":"$http_x_forwarded_for",'
      '"request_time":"$request_time",'
      '"upstream_response_time":"$upstream_response_time",'
      '"upstream_addr":"$upstream_addr",'
      '"upstream_status":"$upstream_status",'
      '"request_length":"$request_length",'
      '"scheme":"$scheme",'
      '"host":"$host",'
      '"server_name":"$server_name"'
    '}';

    # Configurar logs en formato JSON
    access_log  /var/log/nginx/access.log  json_combined;

    # Limitar rate de requests (prevención de DoS/DDoS) - Contexto HTTP
    limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Optimización de rendimiento
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Limitar tamaño de requests (prevención de ataques de buffer overflow)
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Incluir configuraciones adicionales
    include /etc/nginx/conf.d/*.conf;

    # Configuración para stub_status (métricas de Nginx)
    # Puerto dedicado para que nginx-exporter pueda alcanzarlo desde la red Docker
    server {
        listen 8081;
        server_name localhost;

        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }
}
