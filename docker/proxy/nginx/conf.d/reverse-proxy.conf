# Upstream para la API (.NET container en observability-net)
upstream node1_api {
    server membresia-api:8080;
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

# Servidor principal para api.observabilidad.local
server {
    listen 80;
    listen 443 ssl;
    server_name api.observabilidad.local;

    # Configuración SSL (certificado auto-firmado para desarrollo local)
    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # Configuraciones SSL recomendadas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers adicionales
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    # Logs de acceso (ya configurados en nginx.conf como JSON)
    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    # Rate limiting para prevención de DoS (usando zonas definidas en nginx.conf)
    limit_req zone=api burst=50 nodelay;
    limit_conn addr 10;

    # Health check para el upstream
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Configuración de proxy para la API
    location /api/ {
        # Rate limiting específico para API
        limit_req zone=api burst=100 nodelay;

        # Proxy pass al upstream
        proxy_pass http://node1_api;

        # Headers estándar de proxy
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Headers adicionales de seguridad
        proxy_set_header X-Content-Type-Options "nosniff";
        proxy_set_header X-Frame-Options "SAMEORIGIN";

        # Configuración de buffering
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # Timeouts específicos para API
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Endpoint raíz redirige a la API
    location = / {
        return 308 https://$host/api/;
    }

    # Endpoint de health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Denegar acceso a archivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
